<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Pesquise isto</title>
<meta name="description" content="Cada um destes termos leva a uma pesquisa no Google.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>🔍</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">

</head>
<body>
<div class="wrap">
  <header class="head">
    <h1>Pesquise<br>isto.</h1>
    <p class="sub" id="sub"></p>
  </header>
  <main>
    <ul class="list" id="list"></ul>
    <div class="foot">
      <span id="count"></span>
      <button class="link" id="share">Mande para alguém curioso</button>
    </div>
    <p class="toast" id="toast" aria-live="polite"></p>
    <button class="link small" id="prefs" hidden>Preferências de cookies</button>
  </main>
</div>
<div class="consent" id="consent" role="dialog" aria-labelledby="consent-t" hidden>
  <p id="consent-t">Usamos o Google Analytics, com cookies, para entender quais termos despertam curiosidade. Pode recusar sem perder nada.</p>
  <div class="consent-btns">
    <button class="btn" id="deny">Recusar</button>
    <button class="btn" id="allow">Aceitar</button>
  </div>
</div>
<script src="js/terms.js"></script>
<script src="js/main.js"></script>
</body>
</html>
